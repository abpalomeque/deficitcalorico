name: Test Ritmo
on:
  push:
    branches: [main]
    paths: ['web/**', 'index.html', 'tests/**', 'package.json', '.github/workflows/tests.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
